            previous knowledge (Tanti et al., 2026). Furthermore, the
            second successful criterion focuses on developing students’
            abilities to drive communication with AI to actively spot
            their own misunderstandings. It leverages the learning theory
            that novice learners consolidate their superficial learning
            when actively trying to explain their understanding to others
            and themselves (Tanti et al., 2026). According to PICRAT, AI’s
            participation in this learning activity is <em>transformative</em>
            as it is impossible without AI’s powerful knowledge base and its
            interactive nature (Kimmons et al., 2020). Students’ participation
            is also <em>interactive</em>, which enhances their learning agency
            as each step stems from their authentic explanations and
            explorations of the right answers.
          </p>
          <h3>Meeting the Unit Outcomes</h3>
          <p>
            The resource is firmly rooted in the mechanisms discovered by studies
            of how AI damages learners’ agency and outcomes – overloading
            cognitive load and creating illusions of understanding

            improper uses of AI lead to the compromising of students’ well-being
            and by promoting healthy ways of using AI that enhance the natural
            occasions where genuine learning occurs for humans. The resource
            also met ULO2, as it instructs teachers to explicitly teach these
            healthy ways of using AI to students, providing opportunities for
            students to learn authentically.
          </p>
        </section>

    // =========================================
    // PAGE NAVIGATION
    // =========================================
    const pageContent = document.getElementById("page-content");
    const navigationLinks = document.querySelectorAll(".sidebar a");
    function showPage(pageName) {
      if (!Object.prototype.hasOwnProperty.call(pageData, pageName)) {
        return;
      }
      pageContent.innerHTML = pageData[pageName];
      navigationLinks.forEach(link => {
        const isActive = link.dataset.page === pageName;
        link.classList.toggle("active", isActive);
        if (isActive) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
      window.scrollTo({
        top: 0,
        behavior: "auto"
      });
    }
    navigationLinks.forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        showPage(link.dataset.page);
      });
    });
    // =========================================
    // REPEAT ANIMATION HELPER
    // =========================================
    function animateRepeatSteps(list, stepNumbers) {
      stepNumbers.forEach(number => {
        const step = Array.from(
          list.querySelectorAll(".procedure-step")
        ).find(button => {
          return button.querySelector(".step-number")
            ?.textContent.trim() === String(number);
        });
        if (!step) return;
        // Restart the stripe animation.
        step.classList.remove("repeat-glow");
        void step.offsetWidth;
        step.classList.add("repeat-glow");
        // Clear an existing banner before adding a new one.
        const parent = step.closest("li");
        const oldBanner = parent.querySelector(".repeat-banner");
        if (oldBanner) {
          oldBanner.remove();
        }
        const banner = document.createElement("div");
        banner.className = "repeat-banner";
        banner.textContent = "REPEAT!";
        banner.setAttribute("aria-hidden", "true");
        parent.appendChild(banner);
        // Remove the banner and stripe after their animations.
        setTimeout(() => {
          banner.remove();
        }, 1150);
        setTimeout(() => {
          step.classList.remove("repeat-glow");
        }, 950);
      });
    }
    // =========================================
    // PROCEDURE INTERACTIONS
    // =========================================
    pageContent.addEventListener("click", function (event) {
      // Handle reset button.
      const resetButton = event.target.closest("[data-reset]");
      if (resetButton) {
        event.preventDefault();
        event.stopPropagation();
        const section = resetButton.closest(".resource-section");
        const list = section.querySelector(".procedure-list");
        // Return to Step 1.
        Array.from(list.children).forEach((item, index) => {
          if (index > 0) {
            item.hidden = true;
          }
        });
        // Remove any ongoing animations and banners.
        list.querySelectorAll(".repeat-glow").forEach(step => {
          step.classList.remove("repeat-glow");
        });
        list.querySelectorAll(".repeat-banner").forEach(banner => {
          banner.remove();
        });
        list.querySelector(".procedure-step").focus();
        return;
      }
      const button = event.target.closest(".procedure-step");
      if (!button || !pageContent.contains(button)) {
        return;
      }
      const currentStep = button.closest("li");
      const list = currentStep.closest(".procedure-list");
      const nextStep = currentStep.nextElementSibling;
      const stepNumber = button
        .querySelector(".step-number")
        .textContent.trim();
      const section = button.closest(".resource-section");
      const criterion = section
        ?.querySelector(".criterion-label")
        ?.textContent.trim();
      // Reveal the next hidden step.
      if (nextStep && nextStep.hidden) {
        nextStep.hidden = false;
        nextStep.querySelector(".procedure-step").focus();
        return;
      }
      // Criterion 1: Step 6 repeats Steps 4 and 5.
      if (
        criterion === "SUCCESSFUL CRITERION 1" &&
        stepNumber === "6"
      ) {
        animateRepeatSteps(list, [4, 5]);
      }
      // Criterion 2: Step 5 repeats Steps 2, 3, and 4.
      if (
        criterion === "SUCCESSFUL CRITERION 2" &&
        stepNumber === "5"
      ) {
        animateRepeatSteps(list, [2, 3, 4]);
      }
    });
    // Show homepage initially.
    showPage("home");
  </script>
